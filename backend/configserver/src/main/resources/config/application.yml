# Shared defaults for all Robo Dance services
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

robo-dance:
  jwt:
    secret: robo-dance-dev-secret-change-me-in-prod-min-32-chars
    expiration-ms: 86400000

spring:
  datasource:
    username: robodance
    password: robodance
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
