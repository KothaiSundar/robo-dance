services:
  mysql:
    image: mysql:8.4
    container_name: robodance-mysql
    ports:
      # Host 3307 — local MySQL Server already uses 3306
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: robodance
      MYSQL_PASSWORD: robodance
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - robodance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  robodance_mysql_data:
